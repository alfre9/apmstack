<title>Focus Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: header with style swatches, then two tabs over the same items.
   Brief: one-line lead, the top three, this week's due dates beside who you are waiting on, then the rest on an impact x effort grid beside its ranked list.
   Board: load per project as stacked bars (click to filter), the PM's goals with milestone bars, then every item grouped by project.
   Every color is a light-dark() token, so one set per style covers both themes; the theme blocks only flip color-scheme. */
:root {
  color-scheme: light;
  --bg: light-dark(#F6F7F9, #0D0F12);
  --surface: light-dark(#FFFFFF, #15181D);
  --surface-2: light-dark(#EEF0F3, #1B1F25);
  --fg: light-dark(#12151A, #E7E9ED);
  --fg-2: light-dark(#3A414C, #BFC5CE);
  --muted: light-dark(#5F6878, #8C95A3);
  --line: light-dark(#E2E5EA, #272C34);
  --accent: light-dark(#2E5BE8, #84A2FF);
  --accent-fg: light-dark(#FFFFFF, #0D0F12);
  --hot: var(--surface);
  --hot-fg: var(--fg);
  --bad: light-dark(#C62828, #FF7B72);
  --warn: light-dark(#9A5800, #F2B544);
  --ok: light-dark(#1E7F4F, #5FD39A);
  --d1: light-dark(#2F6FDB, #79A6FF);
  --d2: light-dark(#D24A12, #FF8A5B);
  --d3: light-dark(#0E8F6B, #4FD1A5);
  --d4: light-dark(#B5338A, #F07BC6);
  --d5: light-dark(#86690A, #E0C04A);
  --d6: light-dark(#5B5BD6, #A3A3FF);
  --art: none;
  --glass: none;
  --font-display: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --fs: 15px;
  --t-xs: 12px;
  --t-sm: 13px;
  --t-lg: 18px;
  --t-xl: 24px;
  --display-weight: 600;
  --display-track: -0.025em;
  --radius: 12px;
  --radius-sm: 8px;
  --bw: 1px;
  --line-style: solid;
  --shadow: 0 0 #0000;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark } }
:root[data-theme="dark"] { color-scheme: dark }

:root[data-style="glass"] {
  --bg: light-dark(#DCE4F2, #0A0E1C);
  --surface: light-dark(rgb(255 255 255 / .5), rgb(255 255 255 / .06));
  --surface-2: light-dark(rgb(255 255 255 / .4), rgb(255 255 255 / .06));
  --fg: light-dark(#0F1626, #EEF1FA);
  --fg-2: light-dark(#2D3850, #C3CAE0);
  --muted: light-dark(#4E5872, #98A3C0);
  --line: light-dark(rgb(255 255 255 / .85), rgb(255 255 255 / .13));
  --accent: light-dark(#3346D3, #A9B8FF);
  --accent-fg: light-dark(#FFFFFF, #0A0E1C);
  --hot: light-dark(rgb(255 255 255 / .66), rgb(255 255 255 / .09));
  --art:
    radial-gradient(38rem 30rem at 6% 4%, light-dark(#8FE3F0, #11506A), transparent 70%),
    radial-gradient(34rem 28rem at 94% 14%, light-dark(#FFC4AA, #66223F), transparent 70%),
    radial-gradient(44rem 34rem at 55% 100%, light-dark(#C9BCFF, #2C2370), transparent 70%),
    var(--bg);
  --glass: blur(22px) saturate(170%);
  --font-display: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --display-weight: 700;
  --radius: 20px;
  --radius-sm: 12px;
  --shadow: 0 12px 32px -14px light-dark(rgb(30 40 90 / .3), rgb(0 0 0 / .7)), inset 0 1px 0 light-dark(rgb(255 255 255 / .9), rgb(255 255 255 / .08));
}
:root[data-style="brutalist"] {
  --bg: light-dark(#ECECE4, #101010);
  --surface: light-dark(#FFFFFF, #1C1C1C);
  --surface-2: light-dark(#DADAD0, #2A2A2A);
  --fg: light-dark(#0B0B0B, #F2F2EC);
  --fg-2: light-dark(#1F1F1F, #DADAD2);
  --muted: light-dark(#45453F, #ABABA3);
  --line: light-dark(#0B0B0B, #F2F2EC);
  --accent: light-dark(#2340F0, #8EA0FF);
  --accent-fg: light-dark(#FFFFFF, #101010);
  --hot: #FFD23F;
  --hot-fg: #0B0B0B;
  --font-display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --font-body: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "Space Mono", ui-monospace, Menlo, Consolas, monospace;
  --display-weight: 700;
  --display-track: -0.03em;
  --radius: 0;
  --radius-sm: 0;
  --bw: 2px;
  --shadow: 4px 4px 0 var(--line);
}
:root[data-style="editorial"] {
  --bg: light-dark(#FAF9F6, #12110F);
  --surface: transparent;
  --surface-2: light-dark(#EFECE5, #1D1B18);
  --fg: light-dark(#16140F, #EDE9E1);
  --fg-2: light-dark(#3B372F, #C9C3B8);
  --muted: light-dark(#6A645A, #9A9385);
  --line: light-dark(#D6D0C4, #36322B);
  --accent: light-dark(#1E3A8A, #A8B9F0);
  --accent-fg: light-dark(#FFFFFF, #12110F);
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-body: "Newsreader", Georgia, "Times New Roman", serif;
  --fs: 16px;
  --t-xl: 30px;
  --display-weight: 500;
  --display-track: -0.01em;
  --radius: 0;
  --radius-sm: 0;
}
:root[data-style="terminal"] {
  --bg: light-dark(#F3F1EC, #0B0A07);
  --surface: light-dark(#FBFAF6, #12100B);
  --surface-2: light-dark(#E9E5DA, #1B1810);
  --fg: light-dark(#2A251B, #F1D9A6);
  --fg-2: light-dark(#3F382A, #D9C190);
  --muted: light-dark(#776D5D, #9A8763);
  --line: light-dark(#C9C1AF, #3D3526);
  --accent: light-dark(#A04C00, #FFB020);
  --accent-fg: light-dark(#FFFFFF, #0B0A07);
  --font-display: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --font-body: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --fs: 14px;
  --t-xl: 20px;
  --display-weight: 600;
  --display-track: 0;
  --radius: 0;
  --radius-sm: 0;
  --line-style: dashed;
}

*, *::before, *::after { box-sizing: border-box }
[hidden] { display: none !important }
html { scrollbar-color: color-mix(in srgb, var(--muted) 45%, transparent) transparent }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 var(--fs)/1.5 var(--font-body); -webkit-font-smoothing: antialiased; accent-color: var(--accent); caret-color: var(--accent) }
::selection { background: color-mix(in srgb, var(--accent) 28%, transparent) }
.art { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: var(--art) }
.wrap { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding-block: 22px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 28px }
.view { display: grid; gap: 36px }
h1, h2, h3, p, figure { margin: 0 }
a { color: var(--accent) }
button { font: inherit; color: inherit }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap }
.chk:focus-visible, button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
svg { flex: none }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 20px }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px }
h1 { font: var(--display-weight) 32px/1 var(--font-display); letter-spacing: var(--display-track) }
.stamp { color: var(--muted); font: 500 var(--t-sm)/1.3 var(--font-mono); font-variant-numeric: tabular-nums }
.tools { display: flex; align-items: center; gap: 12px }
.swatches { display: flex; align-items: center; gap: 7px }
.sw { width: 30px; height: 30px; padding: 0; border-radius: 8px; border: 1px solid transparent; display: grid; place-items: center; font: 600 13px/1 var(--f); cursor: pointer; transition: transform .15s }
.sw:hover { transform: translateY(-1px) }
.sw[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px }
.sw[data-s="minimal"] { background: light-dark(#FFFFFF, #15181D); color: light-dark(#12151A, #E7E9ED); border-color: light-dark(#D5D9E0, #2E343D) }
.sw[data-s="glass"] { background: linear-gradient(135deg, light-dark(#8FE3F0, #11506A), light-dark(#C9BCFF, #2C2370) 55%, light-dark(#FFC4AA, #66223F)); color: light-dark(#0F1626, #EEF1FA); border-color: light-dark(rgb(255 255 255 / .9), rgb(255 255 255 / .2)) }
.sw[data-s="brutalist"] { background: #FFD23F; color: #0B0B0B; border: 2px solid #0B0B0B; border-radius: 0; box-shadow: 2px 2px 0 light-dark(#0B0B0B, #F2F2EC) }
.sw[data-s="editorial"] { background: light-dark(#FAF9F6, #12110F); color: light-dark(#16140F, #EDE9E1); border-color: light-dark(#D6D0C4, #36322B); border-radius: 0; font-style: italic; font-weight: 500; font-size: 15px }
.sw[data-s="terminal"] { background: light-dark(#2A251B, #0B0A07); color: #FFB020; border-color: light-dark(#2A251B, #3D3526); border-radius: 0 }
.btn { display: inline-flex; align-items: center; gap: 7px; font: 600 var(--t-sm)/1 var(--font-body); padding: 8px 12px; border-radius: var(--radius-sm); border: var(--bw) var(--line-style) var(--line); background: var(--surface); color: var(--fg); box-shadow: var(--shadow); cursor: pointer; backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass) }
.btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg) }

.tabbar { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; border-bottom: var(--bw) var(--line-style) var(--line) }
.tabs { display: flex; gap: 4px }
.tab { position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 10px 12px 12px; border: 0; background: none; color: var(--muted); font: 600 15px/1 var(--font-display); cursor: pointer }
.tab:hover, .tab[aria-selected="true"] { color: var(--fg) }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: calc(-1 * var(--bw)); height: 2px; background: var(--accent) }
.tab .n { font: 600 var(--t-xs)/1 var(--font-mono); padding: 3px 6px; border-radius: 99px; background: var(--surface-2); color: var(--fg-2); font-variant-numeric: tabular-nums }
.fchip { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 8px; padding: 5px 8px 5px 10px; border-radius: 99px; border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 9%, transparent); color: var(--accent); font: 600 var(--t-sm)/1 var(--font-body); cursor: pointer }

.alerts { display: grid; gap: 8px }
.alert { padding: 9px 14px; border-radius: var(--radius-sm); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 9%, var(--bg)); font-size: var(--t-sm) }
.alert ul { margin: 6px 0 0; padding-left: 18px; font: var(--t-xs)/1.5 var(--font-mono) }

/* Section heads */
.sec-head, summary { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 14px }
h2 { font: 600 var(--t-xs)/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: .09em; color: var(--muted) }
.count { font: 500 var(--t-xs) var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums }
.push { margin-left: auto }
summary { cursor: pointer; list-style: none; margin-bottom: 0; padding: 4px 0 }
summary::-webkit-details-marker { display: none }
details[open] summary { margin-bottom: 14px }
details[open] summary svg { transform: rotate(180deg) }

.panel, .now-card { background: var(--surface); border: var(--bw) var(--line-style) var(--line); border-radius: var(--radius); box-shadow: var(--shadow); backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass) }
.pad { padding: 14px 16px }

/* Shared marks */
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none }
.av { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; font: 700 10px/1 var(--font-body); letter-spacing: .02em; background: color-mix(in srgb, currentColor 13%, transparent); color: inherit }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 99px; background: color-mix(in srgb, currentColor 9%, transparent); white-space: nowrap }
.chip.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent) }
.chip.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent) }
.chip.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 13%, transparent) }
.chip.now { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent) }
.nd { display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: var(--accent); vertical-align: 2px }
.icon-btn { display: inline-grid; place-items: center; width: 28px; height: 28px; padding: 0; border-radius: var(--radius-sm); border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; text-decoration: none }
.icon-btn:hover { color: var(--fg); background: color-mix(in srgb, currentColor 10%, transparent) }
.icon-btn svg { transition: transform .15s }
.icon-btn[aria-expanded="true"] svg { transform: rotate(180deg) }

/* Impact bars and effort pie: the two marks the ranking runs on */
.meter { display: inline-flex; align-items: flex-end; justify-content: center; gap: 2px; min-width: 26px; height: 26px; padding: 5px; border-radius: 6px; border: 1px solid transparent; background: transparent; color: inherit; cursor: pointer }
.meter:hover { background: color-mix(in srgb, currentColor 10%, transparent) }
.meter.mine { border-color: color-mix(in srgb, var(--accent) 55%, transparent) }
.meter.static { cursor: default; min-width: 0; padding: 0; height: 16px; border: 0 }
.meter.static:hover { background: none }
.m-i span { width: 4px; border-radius: 1px; background: color-mix(in srgb, currentColor 22%, transparent) }
.m-i span:nth-child(1) { height: 5px }
.m-i span:nth-child(2) { height: 9px }
.m-i span:nth-child(3) { height: 13px }
.m-i span.on { background: var(--accent) }
.m-e { align-items: center }
.pie { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid currentColor; background: conic-gradient(currentColor calc(var(--e) * 120deg), transparent 0); opacity: .8 }

/* Lead */
.lead { display: grid; gap: 12px; max-width: 70ch }
.headline { font: var(--display-weight) var(--t-xl)/1.25 var(--font-display); letter-spacing: var(--display-track); text-wrap: balance }
.newbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font: 500 var(--t-xs)/1 var(--font-mono); color: var(--muted) }
.newbar .chip { padding: 4px 8px; color: var(--fg-2) }

/* Top 3 */
.pips { display: inline-flex; gap: 4px }
.pips i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--accent) }
.pips i.on { background: var(--accent) }
.now-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); gap: 16px }
.now-card { background: var(--hot); color: var(--hot-fg); padding: 14px 16px 16px; display: grid; grid-template-rows: auto auto 1fr auto; gap: 10px; transition: opacity .2s }
.nc-head { display: flex; align-items: center; gap: 2px }
.rank { margin-right: auto; font: var(--display-weight) 30px/1 var(--font-display); letter-spacing: var(--display-track); color: var(--accent); font-variant-numeric: tabular-nums }
.nc-title { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px }
.now-card .t { font-size: var(--t-lg); line-height: 1.3 }
.now-card .why { font-size: var(--t-sm); line-height: 1.45; opacity: .82; padding-left: 30px }
.now-card .rm { padding-left: 30px; color: inherit; opacity: .78 }
.now-card.is-done { opacity: .55 }

/* Checkbox and title */
.chk { appearance: none; -webkit-appearance: none; margin: 1px 0 0; width: 18px; height: 18px; border: 1.5px solid currentColor; border-radius: calc(var(--radius-sm) * .6); background: transparent; display: grid; place-content: center; cursor: pointer; opacity: .75 }
.chk::before { content: ""; width: 10px; height: 10px; background: var(--accent-fg); clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0, 43% 62%); transform: scale(0); transition: transform .12s }
.chk:checked { background: var(--accent); border-color: var(--accent); opacity: 1 }
.chk:checked::before { transform: scale(1) }
.t { font: 600 var(--fs)/1.35 var(--font-display); letter-spacing: calc(var(--display-track) / 3); cursor: pointer; text-wrap: pretty; overflow-wrap: anywhere }
.is-done .t { text-decoration: line-through; opacity: .7 }

/* Item meta: graphics first, words only where a mark cannot carry it */
.rm { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 10px; font: 500 var(--t-xs)/1.4 var(--font-mono); color: var(--muted) }
.rm > span { display: inline-flex; align-items: center; gap: 5px; min-width: 0 }

/* Rows */
.list { list-style: none; margin: 0; padding: 0 }
.row { display: grid; grid-template-columns: auto 20px minmax(0, 1fr) auto 28px; column-gap: 10px; align-items: start; padding: 11px 10px 11px 14px; transition: background-color .15s }
.row + .row { border-top: 1px var(--line-style) var(--line) }
.row.hl { background: color-mix(in srgb, var(--accent) 8%, transparent) }
.rk { min-width: 1.5em; text-align: right; font: 600 var(--t-sm)/22px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums }
.rk:empty { min-width: 0 }
.rb { display: grid; gap: 5px; min-width: 0 }
.rs { display: flex; align-items: center; gap: 2px; margin-top: -3px; color: var(--fg-2) }
.row > .icon-btn { margin-top: -3px }
.rd { display: grid; gap: 6px; padding-top: 4px; font-size: var(--t-sm); color: var(--fg-2) }
.rd .src-line { display: flex; flex-wrap: wrap; gap: 4px 12px; font: 500 var(--t-xs)/1.4 var(--font-mono); color: var(--muted) }
.quote { margin: 0; padding-left: 10px; border-left: 1px solid var(--line); font-style: italic; color: var(--muted); overflow-wrap: anywhere }
.open { text-decoration: none }
.open:hover { text-decoration: underline }
.empty { padding: 14px 16px; color: var(--muted); font-size: var(--t-sm); list-style: none }

/* This week */
.pulse { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; align-items: start }
.tl { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; overflow-x: auto }
.day { display: grid; gap: 8px; justify-items: center; padding: 8px 2px; border-radius: var(--radius-sm) }
.day.today { background: color-mix(in srgb, var(--accent) 10%, transparent) }
.stack { width: 100%; height: 80px; display: flex; flex-direction: column-reverse; align-items: center; gap: 4px; border-bottom: 2px solid var(--line) }
.stack i { width: 13px; height: 13px; border-radius: 50%; background: var(--c); flex: none }
.day.late .stack i { outline: 2px solid var(--bad); outline-offset: 1px }
.stack b { font: 600 11px/1 var(--font-mono); color: var(--muted) }
.dl { display: grid; justify-items: center; gap: 2px; font: 500 var(--t-xs)/1.2 var(--font-mono); color: var(--muted) }
.dl b { font: 600 15px/1.1 var(--font-display); color: var(--fg); font-variant-numeric: tabular-nums }
.day.late .dl, .day.late .dl b { color: var(--bad) }
.day.weekend .stack { opacity: .55 }
.day.weekend .dl b { color: var(--muted) }

/* Waiting: age as bar length */
.aging .age { display: grid; grid-template-columns: 20px 20px minmax(0, 1fr) minmax(56px, 28%) 2.4em; gap: 10px; align-items: center; padding: 10px 14px }
.aging .age + .age { border-top: 1px var(--line-style) var(--line) }
.aging .av { color: var(--fg-2) }
.at { font: 500 var(--t-sm)/1.3 var(--font-body); overflow-wrap: anywhere; cursor: pointer }
.abar { height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--fg) 8%, transparent); overflow: hidden }
.abar i { display: block; height: 100%; border-radius: inherit; background: color-mix(in srgb, var(--fg) 38%, transparent) }
.abar i.warn { background: var(--warn) }
.ad { font: 600 var(--t-sm) var(--font-mono); text-align: right; font-variant-numeric: tabular-nums }

/* The rest: impact x effort grid beside its ranked list */
.legend { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font: 500 var(--t-xs) var(--font-mono); color: var(--muted) }
.legend span { display: inline-flex; align-items: center; gap: 5px }

      <div class="newbar" id="newbar"></div>
    </div>

    <section aria-labelledby="h-now">
      <div class="sec-head"><h2 id="h-now">Top 3</h2><span class="pips" id="pips" role="img"></span></div>
      <ol class="now-grid" id="now-list"></ol>
    </section>

    <div class="pulse">
      <section aria-labelledby="h-week">
        <div class="sec-head"><h2 id="h-week">This week</h2><span class="count" id="n-week"></span></div>
        <div class="panel pad"><div class="tl" id="timeline"></div></div>
      </section>
      <section aria-labelledby="h-wait">
        <div class="sec-head"><h2 id="h-wait">Waiting on</h2><span class="count" id="n-waiting"></span></div>
        <ul class="list panel aging" id="waiting-list"></ul>
      </section>
    </div>

    <section class="rest" aria-labelledby="h-rest">
      <div class="sec-head">
        <h2 id="h-rest">The rest</h2>
        <span class="legend" id="legend" aria-hidden="true"></span>
        <div class="seg push" id="sorts" role="group" aria-label="Rank by"></div>
      </div>
      <div class="rank-grid">
        <figure>
          <div class="mx" id="matrix" role="group" aria-label="Impact against effort; numbers match the ranked list"></div>
          <p class="mx-note" id="mx-note" hidden></p>
        </figure>
        <ol class="list panel" id="rank-list"></ol>
      </div>
    </section>
  </div>

  <div class="view" id="view-board" role="tabpanel" aria-labelledby="tab-board" hidden>
    <section aria-labelledby="h-load">
      <div class="sec-head"><h2 id="h-load">Projects</h2><span class="legend" id="load-legend" aria-hidden="true"></span></div>
      <div class="panel pad load" id="load"></div>
    </section>
    <section aria-labelledby="h-goals">
      <div class="sec-head"><h2 id="h-goals">My goals</h2><span class="count" id="n-goals"></span><span class="lvl push" id="level" hidden></span></div>
      <ul class="goal-grid" id="goal-list"></ul>
    </section>
    <div class="groups" id="groups"></div>
  </div>

  <details class="fold" id="done">
    <summary><h2>Done here</h2><span class="count" id="n-done"></span><span class="icon-btn push" aria-hidden="true" id="done-chev"></span></summary>
    <ul class="list panel" id="done-list"></ul>
  </details>

  <footer>
    <ul class="sources" id="sources"></ul>
    <span class="push">Read only · ticks and scores stay in this browser</span>
  </footer>
</div>

<script>
(() => {
  const STYLES = [
    ['minimal', 'Minimal', '"Geist", system-ui, sans-serif'],
    ['glass', 'Glass', '"Plus Jakarta Sans", system-ui, sans-serif'],
    ['brutalist', 'Brutalist', '"Space Grotesk", system-ui, sans-serif'],
    ['editorial', 'Editorial', '"Newsreader", Georgia, serif'],
    ['terminal', 'Terminal', '"JetBrains Mono", ui-monospace, monospace']
  ];
  const BUCKETS = ['now', 'next', 'later', 'waiting'];
  const BUCKET_NAME = { now: 'Now', next: 'Next', later: 'Later', waiting: 'Waiting' };
  const KIND = { tracker: 'Ticket', email: 'Email', chat: 'Chat', notes: 'Note', docs: 'Doc', calendar: 'Calendar' };
  const STATUS = { 'on track': ['ok', 'On track'], 'at risk': ['warn', 'At risk'], 'off track': ['bad', 'Off track'], done: ['ok', 'Done'], unknown: ['', 'No update'] };
  const PATHS = {
    tracker: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/>',
    email: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
    chat: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12Z"/>',
    notes: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    other: '<circle cx="12" cy="12" r="8"/>',
    open: '<path d="M7 17 17 7M8 7h9v9"/>',
    chevron: '<path d="m6 9 6 6 6-6"/>',
    focus: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
    close: '<path d="M6 6l12 12M18 6 6 18"/>'
  };
  PATHS.docs = PATHS.notes;
  const STATE = { ready: 'ready', 'needs sign-in': 'signin', error: 'error' };
  const QUADS = { '3,1': ['Quick wins', 'qw'], '3,3': ['Big bets', ''], '1,1': ['Fill-ins', ''], '1,3': ['Time sinks', 'ts'] };
  const LEVEL = ['', 'Low', 'Med', 'High'];

  const $ = s => document.querySelector(s);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const icon = (name, size = 14) => { const s = el('span'); s.innerHTML = '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (PATHS[name] || PATHS.other) + '</svg>'; return s.firstChild; };
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const hash = s => { let h = 5381; for (const c of s) h = (h * 33 + c.charCodeAt(0)) >>> 0; return h.toString(36); };
  const day = s => (typeof s === 'string' && /^\d{4}-\d{2}-\d{2}/.test(s)) ? new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) : null;
  const short = s => day(s).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  const safeUrl = u => typeof u === 'string' && /^https?:\/\//i.test(u) ? u : null;
  const strings = a => (Array.isArray(a) ? a : []).filter(x => typeof x === 'string' && x);
  const score = v => [1, 2, 3].includes(v) ? v : null;
  const initials = n => n.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Load and check what /pm-dash wrote. Anything malformed is left out and listed, never half-shown.
  const problems = [];
  let data;
  try { data = JSON.parse($('#pm-data').textContent); }
  catch (e) { data = {}; problems.push('The data block is not valid JSON (' + e.message + '). Run /pm-dash again.'); }
  const domains = new Map((Array.isArray(data.domains) ? data.domains : []).filter(d => d && d.id).map((d, i) => [d.id, { name: d.name || d.id, color: 'var(--d' + (i % 6 + 1) + ')' }]));
  const gids = new Set();
  const goals = (Array.isArray(data.goals) ? data.goals : []).filter(g => {
    const p = g && g.progress;
    const bad = !g || typeof g !== 'object' ? 'not an object'
      : !g.id ? 'no id' : gids.has(g.id) ? 'duplicate id' : !g.title ? 'no title'
      : !Object.hasOwn(STATUS, g.status) ? 'unknown status "' + g.status + '"'
      : g.domain && !domains.has(g.domain) ? 'unknown project "' + g.domain + '"'
      : g.due && !day(g.due) ? 'due is not YYYY-MM-DD' : g.asof && !day(g.asof) ? 'asof is not YYYY-MM-DD'
      : p && !(Number.isInteger(p.done) && Number.isInteger(p.total) && p.total > 0 && p.done >= 0 && p.done <= p.total) ? 'progress is not whole numbers with done <= total' : '';
    if (bad) { problems.push('Goal ' + ((g && (g.id || g.title)) || '?') + ': ' + bad); return false; }
    gids.add(g.id);
    return true;
  });
  const ids = new Set();
  const todos = (Array.isArray(data.todos) ? data.todos : []).filter(t => {
    const bad = !t || typeof t !== 'object' ? 'not an object'
      : !t.id ? 'no id' : ids.has(t.id) ? 'duplicate id'
      : !t.title ? 'no title' : !BUCKETS.includes(t.bucket) ? 'unknown bucket "' + t.bucket + '"'
      : t.domain && !domains.has(t.domain) ? 'unknown project "' + t.domain + '"'
      : t.due && !day(t.due) ? 'due is not YYYY-MM-DD' : t.since && !day(t.since) ? 'since is not YYYY-MM-DD' : '';
    if (bad) { problems.push((t && (t.id || t.title)) + ': ' + bad); return false; }
    for (const k of ['impact', 'effort']) if (t[k] != null && !score(t[k])) { problems.push(t.id + ': ' + k + ' must be 1, 2 or 3'); t[k] = null; }
    if (t.goal && !gids.has(t.goal)) { problems.push(t.id + ': unknown goal "' + t.goal + '", link left out'); delete t.goal; }
    ids.add(t.id);
    return true;
  });
  todos.forEach((t, n) => { t._n = n; });
  let nows = 0, moved = 0;
  for (const t of todos) if (t.bucket === 'now' && ++nows > 3) { t.bucket = 'next'; moved++; }
  if (moved) problems.push(moved + ' item(s) marked Now beyond the limit of three are ranked with the rest.');

  // Sample data keeps its own date so the example reads the same whenever it is opened.
  const generated = new Date(data.generated || Date.now());
  const clock = data.sample && !isNaN(generated) ? generated : new Date();
  const today = new Date(clock.getFullYear(), clock.getMonth(), clock.getDate());
  const diff = s => Math.round((day(s) - today) / 864e5);
  const toolFor = kind => ((data.sources || []).find(s => s.kind === kind) || {}).tool;

  const done = new Set(store.get('pmdash:done', []));
  const scores = store.get('pmdash:scores', {}) || {};
  const opened = new Set();
  let filter = store.get('pmdash:filter', 'all');
  if (filter !== 'all' && filter !== '_unsorted' && !domains.has(filter)) filter = 'all';
  const inFilter = t => filter === 'all' || (filter === '_unsorted' ? !t.domain : t.domain === filter);

  // Ranking: the PM's own score wins over the skill's.
  const imp = t => (scores[t.id] && score(scores[t.id].i)) || t.impact || 0;
  const eff = t => (scores[t.id] && score(scores[t.id].e)) || t.effort || 0;
  const value = t => imp(t) && eff(t) ? imp(t) - eff(t) : -9;
  const byDue = (a, b) => (a.due ? diff(a.due) : 999) - (b.due ? diff(b.due) : 999);
  const SORTS = {
    value: ['Value', 'High impact for low effort first', (a, b) => value(b) - value(a) || imp(b) - imp(a) || byDue(a, b) || a._n - b._n],
    impact: ['Impact', 'Highest impact first', (a, b) => imp(b) - imp(a) || (eff(a) || 9) - (eff(b) || 9) || byDue(a, b) || a._n - b._n],
    quick: ['Quick', 'Least effort first', (a, b) => (eff(a) || 9) - (eff(b) || 9) || imp(b) - imp(a) || byDue(a, b) || a._n - b._n],
    due: ['Due', 'Soonest due first', (a, b) => byDue(a, b) || value(b) - value(a) || a._n - b._n]
  };
  let sortBy = store.get('pmdash:sort', 'value');
  if (!SORTS[sortBy]) sortBy = 'value';

  // Small builders
  function dueChip(t) {
    const n = diff(t.due), d = day(t.due);
    const text = n < 0 ? -n + 'd late' : n === 0 ? 'today' : n === 1 ? 'tomorrow'
      : d.toLocaleDateString(undefined, n < 7 ? { weekday: 'short' } : { day: 'numeric', month: 'short' });
    const c = el('span', 'chip' + (n < 0 ? ' bad' : n <= 1 ? ' warn' : ''));
    c.append(icon('calendar', 12), text);
    c.title = 'Due ' + d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
    return c;
  }
  function avatar(who) { const a = el('span', 'av', initials(who)); a.title = who; a.setAttribute('aria-label', who); return a; }
  function project(t) {
    const d = domains.get(t.domain);
    const s = el('span'); const dot = el('i', 'dot'); dot.style.setProperty('--c', d ? d.color : 'var(--muted)');
    s.append(dot, d ? d.name : 'Unsorted');
    return s;
  }
  function goalChip(id) {
    const g = goals.find(x => x.id === id);
    const [cls, label] = STATUS[g.status];
    const c = el('span', 'chip' + (cls ? ' ' + cls : ''), g.id);
    c.title = 'Goal ' + g.id + ': ' + g.title + ' (' + label.toLowerCase() + ')';
    c.setAttribute('aria-label', c.title);
    return c;
  }
  function meta(t, withBucket) {
    const m = el('div', 'rm');
    m.append(project(t));
    const src = el('span'); src.title = (KIND[t.source] || 'Source') + (t.ref ? ': ' + t.ref : '');
    src.append(icon(t.source));
    if (t.ref && t.ref.length <= 12) src.append(t.ref);
    else src.append(el('span', 'sr', src.title));
    m.append(src);
    if (t.who) m.append(avatar(t.who));
    if (t.due) m.append(dueChip(t));
    if (t.goal) m.append(goalChip(t.goal));
    if (withBucket) m.append(el('span', 'chip' + (t.bucket === 'now' ? ' now' : ''), BUCKET_NAME[t.bucket]));
    return m;
  }
  function check(t, ctx) {
    const cb = el('input', 'chk');
    cb.type = 'checkbox'; cb.id = 'c-' + ctx + '-' + hash(t.id); cb.dataset.key = 'chk:' + ctx + ':' + t.id; cb.checked = done.has(t.id);
    cb.addEventListener('change', () => { cb.checked ? done.add(t.id) : done.delete(t.id); store.set('pmdash:done', [...done]); render(); });
    return cb;
  }
  function title(t, cb) {
    const label = el('label', 't'); label.htmlFor = cb.id;
    if (t.new && !done.has(t.id)) label.append(el('span', 'nd'), el('span', 'sr', 'New: '));
    label.append(t.title);
    return label;
  }
  function meter(t, k, ctx) {
    const v = k === 'i' ? imp(t) : eff(t);
    const mine = scores[t.id] && score(scores[t.id][k]);
    const b = el('button', 'meter m-' + k + (mine ? ' mine' : ''));
    b.type = 'button'; b.dataset.key = k + ':' + ctx + ':' + t.id;
    const label = (k === 'i' ? 'Impact ' : 'Effort ') + (v ? LEVEL[v].toLowerCase() : 'not scored')
      + (mine ? ', set by you (skill said ' + (LEVEL[(k === 'i' ? t.impact : t.effort) || 0] || 'nothing').toLowerCase() + ')' : '') + '. Click to change';
    b.title = label; b.setAttribute('aria-label', label + ': ' + t.title);
    if (k === 'i') for (let n = 1; n <= 3; n++) b.append(el('span', n <= v ? 'on' : ''));
    else { const p = el('span', 'pie'); p.style.setProperty('--e', v); b.append(p); }
    b.addEventListener('click', () => {
      const own = Object.assign({}, scores[t.id], { [k]: v >= 3 ? 1 : v + 1 });
      if (own.i === t.impact) delete own.i;
      if (own.e === t.effort) delete own.e;
      if (own.i || own.e) scores[t.id] = own; else delete scores[t.id];
      store.set('pmdash:scores', scores);
      render();
    });
    return b;
  }
  function details(t) {
    const d = el('div', 'rd');
    if (t.why) d.append(el('p', null, t.why));
    if (t.quote) d.append(el('blockquote', 'quote', t.quote));
    const line = el('div', 'src-line');
    line.append(el('span', null, [KIND[t.source], t.ref].filter(Boolean).join(': ')));
    if (t.who) line.append(el('span', null, (t.bucket === 'waiting' ? 'Waiting on ' : 'From ') + t.who));
    if (t.since) line.append(el('span', null, 'since ' + short(t.since)));
    const url = safeUrl(t.url);
    if (url) { const a = el('a', 'open', 'Open in ' + (toolFor(t.source) || KIND[t.source] || 'source')); a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; line.append(a); }
    d.append(line);
    return d;
  }
  function link(t) {
    const a = el('a', 'icon-btn'); a.href = safeUrl(t.url); a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.title = 'Open ' + (t.ref || t.title) + ' in ' + (toolFor(t.source) || 'source');
    a.setAttribute('aria-label', a.title);
    a.append(icon('open', 15));
    return a;
  }
  function toggle(id, det, btn) {
    opened.has(id) ? opened.delete(id) : opened.add(id);
    det.hidden = !det.hidden; btn.setAttribute('aria-expanded', String(!det.hidden));
  }
  function more(id, label, det, key) {
    const b = el('button', 'icon-btn'); b.type = 'button'; b.dataset.key = key;
    b.setAttribute('aria-expanded', String(!det.hidden)); b.setAttribute('aria-label', 'Details: ' + label);
    b.append(icon('chevron', 16));
    b.addEventListener('click', () => toggle(id, det, b));
    return b;
  }
  function highlight(id, on) {
    document.querySelectorAll('[data-id="' + CSS.escape(id) + '"]').forEach(n => n.classList.toggle('hl', on));
  }
  function hover(node, id) {
    node.addEventListener('mouseenter', () => highlight(id, true));
    node.addEventListener('mouseleave', () => highlight(id, false));
    node.addEventListener('focusin', () => highlight(id, true));
    node.addEventListener('focusout', () => highlight(id, false));
  }

  function row(t, ctx, rank, withBucket) {
    const li = el('li', 'row' + (done.has(t.id) ? ' is-done' : '')); li.dataset.id = t.id;
    li.append(el('span', 'rk', rank ? String(rank) : null));
    const cb = check(t, ctx);
    const body = el('div', 'rb');
    body.append(title(t, cb), meta(t, withBucket));
    const det = details(t); det.hidden = !opened.has(t.id); body.append(det);
    const sc = el('div', 'rs');
    if (t.bucket !== 'waiting') sc.append(meter(t, 'i', ctx), meter(t, 'e', ctx));
    li.append(cb, body, sc, more(t.id, t.title, det, 'more:' + ctx + ':' + t.id));
    hover(li, t.id);
    return li;
  }

  function nowCard(t, rank) {
    const li = el('li', 'now-card' + (done.has(t.id) ? ' is-done' : ''));
    const head = el('div', 'nc-head');
    head.append(el('span', 'rank', String(rank)), meter(t, 'i', 'now'), meter(t, 'e', 'now'));
    if (safeUrl(t.url)) head.append(link(t));
    const cb = check(t, 'now');
    const tt = el('div', 'nc-title'); tt.append(cb, title(t, cb));
    li.append(head, tt, t.why ? el('p', 'why', t.why) : el('span'), meta(t));
    return li;
  }

  function fill(ul, nodes, empty) {
    ul.replaceChildren(...nodes);
    if (!nodes.length) ul.append(el('li', 'empty', empty));
  }

  // Brief
  function brief(live) {
    const head = $('#headline');
    head.textContent = typeof data.headline === 'string' ? data.headline.slice(0, 160) : '';
    head.hidden = !head.textContent;

    const fresh = live.filter(t => t.new);
    const nb = $('#newbar'); nb.replaceChildren();
    if (fresh.length) {
      const since = day(data.since);
      nb.append(el('span', null, fresh.length + ' new' + (since ? ' since ' + since.toLocaleDateString(undefined, { weekday: 'short' }) : '')));
      const bySource = {};
      fresh.forEach(t => { bySource[t.source] = (bySource[t.source] || 0) + 1; });
      for (const [k, n] of Object.entries(bySource)) { const c = el('span', 'chip'); c.title = n + ' new from ' + (toolFor(k) || KIND[k] || k); c.append(icon(k, 13), String(n)); nb.append(c); }
    }
    nb.hidden = !fresh.length;

    const top = todos.filter(t => t.bucket === 'now' && inFilter(t));
    fill($('#now-list'), top.map((t, i) => nowCard(t, i + 1)), 'Nothing urgent. Take the first of the rest.');
    const ticked = top.filter(t => done.has(t.id)).length;
    $('#pips').replaceChildren(...top.map((t, i) => el('i', i < ticked ? 'on' : '')));
    $('#pips').setAttribute('aria-label', ticked + ' of ' + top.length + ' done');

    timeline(live);

    const waiting = todos.filter(t => t.bucket === 'waiting' && inFilter(t) && !done.has(t.id))
      .sort((a, b) => (a.since ? diff(a.since) : 0) - (b.since ? diff(b.since) : 0));
    $('#n-waiting').textContent = waiting.length;
    const max = Math.max(14, ...waiting.map(t => t.since ? -diff(t.since) : 0));
    fill($('#waiting-list'), waiting.map(t => {
      const li = el('li', 'age'); li.dataset.id = t.id;
      const cb = check(t, 'wait');
      const days = t.since ? Math.max(0, -diff(t.since)) : 0;
      const label = el('label', 'at', t.title); label.htmlFor = cb.id; label.title = [t.why, t.ref].filter(Boolean).join(' · ');
      const bar = el('span', 'abar'); bar.setAttribute('aria-hidden', 'true');
      const fillBar = el('i', days >= 5 ? 'warn' : ''); fillBar.style.width = (days / max * 100) + '%'; bar.append(fillBar);
      li.append(cb, t.who ? avatar(t.who) : el('span'), label, bar, el('span', 'ad', days + 'd'));
      return li;
    }), 'Nobody owes you anything.');

    const rest = live.filter(t => t.bucket === 'next' || t.bucket === 'later').sort(SORTS[sortBy][2]);
    const first = top.length + 1;
    fill($('#rank-list'), rest.map((t, i) => row(t, 'rank', first + i)), 'Nothing else on your plate.');
    matrix(rest, first);
  }

  function timeline(live) {
    const dated = live.filter(t => t.due);
    const cols = [];
    const late = dated.filter(t => diff(t.due) < 0);
    if (late.length) cols.push({ name: 'Late', num: String(late.length), items: late, cls: 'late', label: late.length + ' late' });
    for (let d = 0; d < 7; d++) {
      const date = new Date(today); date.setDate(date.getDate() + d);
      const items = dated.filter(t => diff(t.due) === d);
      const name = d === 0 ? 'Today' : date.toLocaleDateString(undefined, { weekday: 'short' });
      cols.push({ name, num: String(date.getDate()), items, cls: (d === 0 ? 'today' : '') + ([0, 6].includes(date.getDay()) ? ' weekend' : ''), label: name + ' ' + date.getDate() + ': ' + items.length + ' due' });
    }
    $('#timeline').replaceChildren(...cols.map(c => {
      const col = el('div', 'day ' + c.cls); col.setAttribute('role', 'img');
      col.setAttribute('aria-label', c.label + (c.items.length ? ': ' + c.items.map(t => t.title).join('; ') : ''));
      const stack = el('div', 'stack');
      c.items.slice(0, 5).forEach(t => { const i = el('i'); i.style.setProperty('--c', (domains.get(t.domain) || {}).color || 'var(--muted)'); i.title = t.title; stack.append(i); });
      if (c.items.length > 5) stack.append(el('b', null, '+' + (c.items.length - 5)));
      const dl = el('div', 'dl'); dl.append(el('span', null, c.name), el('b', null, c.num));
      col.append(stack, dl);
      return col;
    }));
    const ahead = dated.filter(t => diff(t.due) >= 0 && diff(t.due) < 7).length;
    $('#n-week').textContent = ahead + ' due' + (late.length ? ' · ' + late.length + ' late' : '');
  }

  function matrix(rest, first) {
    const mx = $('#matrix');
    const parts = [el('span', 'mx-title-y', 'Impact')];
    for (let i = 3; i >= 1; i--) { const ty = el('span', 'ty', LEVEL[i]); ty.style.gridRow = String(4 - i); parts.push(ty); }
    const grid = el('div', 'mx-grid');
    for (let i = 3; i >= 1; i--) for (let e = 1; e <= 3; e++) {
      const q = QUADS[i + ',' + e];
      const cell = el('div', 'cell' + (q && q[1] ? ' ' + q[1] : ''));
      if (q) cell.append(el('span', 'q', q[0]));
      rest.forEach((t, n) => {
        if (imp(t) !== i || eff(t) !== e) return;
        const p = el('button', 'pt', String(first + n));
        p.type = 'button'; p.dataset.id = t.id; p.dataset.key = 'pt:' + t.id;
        p.style.setProperty('--c', (domains.get(t.domain) || {}).color || 'var(--muted)');
        p.title = t.title;
        p.setAttribute('aria-label', (first + n) + ': ' + t.title + ', impact ' + LEVEL[i].toLowerCase() + ', effort ' + LEVEL[e].toLowerCase() + '. Show details');
        p.addEventListener('click', () => {
          opened.add(t.id); render();
          const r = document.querySelector('#rank-list [data-id="' + CSS.escape(t.id) + '"]');
          if (r) { r.scrollIntoView({ block: 'nearest', behavior: reduced ? 'auto' : 'smooth' }); r.querySelector('.chk').focus({ preventScroll: true }); }
        });
        hover(p, t.id);
        cell.append(p);
      });
      grid.append(cell);
    }
    parts.push(grid);
    for (let e = 1; e <= 3; e++) { const tx = el('span', 'tx', LEVEL[e]); tx.style.gridColumn = String(2 + e); parts.push(tx); }
    parts.push(el('span', 'mx-title-x', 'Effort'));
    mx.replaceChildren(...parts);
    const unscored = rest.filter(t => !imp(t) || !eff(t)).length;
    $('#mx-note').textContent = unscored + ' not scored yet. Set its bars in the list to place it.';
    $('#mx-note').hidden = !unscored;
  }

  // Board
  function goalCard(g) {
    const [cls, label] = STATUS[g.status];
    const li = el('li', 'goal panel'); li.style.setProperty('--s', cls ? 'var(--' + cls + ')' : 'var(--muted)');
    const top = el('div', 'goal-top');
    const st = el('span', 'chip' + (cls ? ' ' + cls : ''), label);
    if (g.asof) st.title = label + ' as of ' + short(g.asof);
    top.append(st, el('span', 'gid', g.id));
    if (g.due) top.append(el('span', 'push', 'by ' + short(g.due)));
    li.append(top, el('p', 't', g.title));
    if (g.progress) {
      const { done: n, total } = g.progress;
      const ms = el('div', 'ms'); ms.setAttribute('role', 'img'); ms.setAttribute('aria-label', n + ' of ' + total + ' milestones');
      for (let i = 0; i < total; i++) ms.append(el('i', i < n ? 'on' : ''));
      const r = el('div', 'ms-row'); r.append(ms, el('span', 'count', n + '/' + total));
      li.append(r);
    }
    if (g.next) { const p = el('p', 'gnext'); p.append(el('span', null, 'Next'), el('span', null, g.next)); li.append(p); }
    const det = el('div', 'rd'); det.hidden = !opened.has('goal:' + g.id);
    if (g.measure) det.append(el('p', null, g.measure));
    if (g.note) det.append(el('p', null, g.note));
    const tags = el('div', 'rm');
    for (const x of strings(g.serves)) tags.append(el('span', 'chip', x));
    for (const x of strings(g.shows)) tags.append(el('span', 'chip', 'Shows: ' + x));
    if (tags.childNodes.length) det.append(tags);
    const foot = el('div', 'rm');
    const d = domains.get(g.domain);
    const left = el('span');
    if (d) { const dot = el('i', 'dot'); dot.style.setProperty('--c', d.color); left.append(dot, d.name); }
    const linked = todos.filter(t => t.goal === g.id && !done.has(t.id)).length;
    if (linked) left.append(el('span', 'chip', linked + ' to-do' + (linked > 1 ? 's' : '')));
    foot.append(left);
    if (det.childNodes.length) foot.append(more('goal:' + g.id, g.title, det, 'more:goal:' + g.id));
    li.append(foot, det);
    return li;
  }

  function board() {
    const groups = [...domains].map(([id, d]) => [id, d.name, d.color]);
    if (todos.some(t => !t.domain)) groups.push(['_unsorted', 'Unsorted', 'var(--muted)']);
    const openIn = id => todos.filter(t => !done.has(t.id) && (id === '_unsorted' ? !t.domain : t.domain === id));
    const max = Math.max(1, ...groups.map(([id]) => openIn(id).length));
    $('#load').replaceChildren(...groups.map(([id, name, color]) => {
      const open = openIn(id);
      const b = el('button', 'lrow'); b.type = 'button'; b.dataset.key = 'load:' + id; b.setAttribute('aria-pressed', String(filter === id));
      const pn = el('span', 'pn'); const dot = el('i', 'dot'); dot.style.setProperty('--c', color); pn.append(dot, name);
      const bar = el('span', 'lbar'); bar.setAttribute('aria-hidden', 'true');
      const parts = [];
      for (const k of BUCKETS) {
        const n = open.filter(t => t.bucket === k).length;
        if (n) { const s = el('i', 'b-' + k); s.style.width = 'calc(' + (n / max * 100) + '% - 2px)'; bar.append(s); parts.push(n + ' ' + BUCKET_NAME[k].toLowerCase()); }
      }
      const overdue = open.filter(t => t.due && diff(t.due) < 0).length;
      b.setAttribute('aria-label', name + ': ' + (parts.join(', ') || 'nothing open') + (overdue ? ', ' + overdue + ' late' : '') + '. Show only this project');
      b.append(pn, bar, el('span', 'ln', String(open.length)), el('span', 'lov', overdue ? overdue + ' late' : ''));
      b.addEventListener('click', () => setFilter(filter === id ? 'all' : id));
      return b;
    }));

    const lv = data.level && typeof data.level === 'object' ? data.level : null;
    const lvl = $('#level');
    lvl.replaceChildren();
    if (lv && typeof lv.current === 'string' && lv.current) {
      lvl.append(el('b', null, lv.current + (lv.target && lv.target !== lv.current ? ' → ' + lv.target : '')));
      const gaps = strings(lv.gaps);
      if (gaps.length) { lvl.append(' no goal shows'); gaps.forEach(x => lvl.append(el('span', 'chip warn', x))); }
    }
    lvl.hidden = !lvl.childNodes.length;
    const shownGoals = goals.filter(g => filter === 'all' || g.domain === filter);
    fill($('#goal-list'), shownGoals.map(goalCard), goals.length ? 'No goal for this project.' : 'No goals set. /pm-mygoals sets them, tied to the company goals and your level.');
    const ok = goals.filter(g => g.status === 'on track' || g.status === 'done').length;
    $('#n-goals').textContent = goals.length ? ok + ' of ' + goals.length + ' on track' : '';

    const order = { now: 0, next: 1, waiting: 2, later: 3 };
    const shown = groups.filter(([id]) => filter === 'all' || filter === id);
    $('#groups').replaceChildren(...shown.map(([id, name, color]) => {
      const items = openIn(id).sort((a, b) => order[a.bucket] - order[b.bucket] || SORTS.value[2](a, b));
      const sec = el('section', 'grp');
      const h = el('h3'); const dot = el('i', 'dot'); dot.style.setProperty('--c', color); h.append(dot, name, el('span', 'count', String(items.length)));
      const ul = el('ul', 'list panel');
      fill(ul, items.map(t => row(t, 'board', 0, true)), 'All done here.');
      sec.append(h, ul);
      return sec;
    }));
  }

  function setFilter(f) { filter = f; store.set('pmdash:filter', f); render(); }

  function render() {
    const key = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null;
    const live = todos.filter(t => !done.has(t.id) && inFilter(t));
    brief(live);
    board();
    const finished = todos.filter(t => done.has(t.id) && inFilter(t));
    fill($('#done-list'), finished.map(t => row(t, 'done', 0, true)), '');
    $('#done').hidden = !finished.length;
    $('#n-done').textContent = finished.length;
    $('#n-board').textContent = todos.filter(t => !done.has(t.id)).length;
    const f = $('#fchip');
    f.hidden = filter === 'all';
    if (filter !== 'all') { f.replaceChildren(filter === '_unsorted' ? 'Unsorted' : domains.get(filter).name, icon('close', 13)); f.setAttribute('aria-label', 'Showing one project. Show all'); }
    for (const b of $('#sorts').children) b.setAttribute('aria-pressed', String(b.dataset.s === sortBy));
    if (key) { const n = document.querySelector('[data-key="' + CSS.escape(key) + '"]'); if (n) n.focus({ preventScroll: true }); }
  }

  // Tabs, routed on #brief and #board so a link can open either view
  const TABS = ['brief', 'board'];
  function showTab(name, focus) {
    for (const t of TABS) {
      const on = t === name, tab = $('#tab-' + t);
      tab.setAttribute('aria-selected', String(on)); tab.tabIndex = on ? 0 : -1;
      $('#view-' + t).hidden = !on;
      if (on && focus) tab.focus();
    }
  }
  for (const t of TABS) $('#tab-' + t).addEventListener('click', () => { location.hash = t; showTab(t); });
  $('.tabs').addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const cur = TABS.findIndex(t => $('#tab-' + t).getAttribute('aria-selected') === 'true');
    const next = TABS[(cur + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length];
    location.hash = next; showTab(next, true);
  });
  const fromHash = () => showTab(location.hash === '#board' ? 'board' : 'brief');
  addEventListener('hashchange', fromHash);
  fromHash();

  // Controls
  function setStyle(s) {
    document.documentElement.dataset.style = s;
    for (const b of $('#styles').children) b.setAttribute('aria-pressed', String(b.dataset.s === s));
  }
  for (const [s, name, font] of STYLES) {
    const b = el('button', 'sw', 'Aa'); b.type = 'button'; b.dataset.s = s; b.style.setProperty('--f', font);
    b.title = name; b.setAttribute('aria-label', 'Style: ' + name);
    b.addEventListener('click', () => { setStyle(s); store.set('pmdash:style', s); });
    $('#styles').append(b);
  }
  const valid = s => STYLES.some(x => x[0] === s);
  const saved = store.get('pmdash:style', null);
  setStyle(valid(saved) ? saved : valid(data.style) ? data.style : 'minimal');

  for (const [s, [name, tip]] of Object.entries(SORTS)) {
    const b = el('button', null, name); b.type = 'button'; b.dataset.s = s; b.title = tip;
    b.addEventListener('click', () => { sortBy = s; store.set('pmdash:sort', s); render(); });
    $('#sorts').append(b);
  }
  const li = el('span'); const mi = el('span', 'meter m-i static'); for (let n = 1; n <= 3; n++) mi.append(el('span', n <= 2 ? 'on' : '')); li.append(mi, 'impact');
  const le = el('span'); const me = el('span', 'meter m-e static'); const pie = el('span', 'pie'); pie.style.setProperty('--e', 1); me.append(pie); le.append(me, 'effort');
  $('#legend').append(li, le);
  $('#load-legend').append(...BUCKETS.map(k => { const s = el('span'); s.append(el('i', 'key b-' + k), BUCKET_NAME[k]); return s; }));
  $('#done-chev').append(icon('chevron', 16));
  $('#fchip').addEventListener('click', () => setFilter('all'));

  const focusBtn = $('#focus-btn');
  const setFocus = on => {
    document.body.classList.toggle('focus', on);
    if (on) showTab('brief');
    focusBtn.setAttribute('aria-pressed', String(on));
    focusBtn.replaceChildren(icon('focus', 15), on ? 'Exit focus' : 'Focus');
  };
  focusBtn.addEventListener('click', () => setFocus(!document.body.classList.contains('focus')));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setFocus(false); });
  setFocus(false);

  let stamp = (data.sample ? 'Sample · ' : '') + clock.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
  if (!isNaN(generated)) stamp += ' · read ' + generated.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  $('#stamp').textContent = stamp;

  const alerts = $('#alerts');
  if (data.sample) alerts.append(el('p', 'alert', 'Sample data. Run /pm-dash for your own.'));
  const hours = (Date.now() - generated) / 36e5;
  if (!data.sample && hours > 20) alerts.append(el('p', 'alert', 'Read ' + Math.round(hours / 24) + ' day(s) ago. Run /pm-dash for a fresh brief.'));
  if (problems.length) {
    const p = el('div', 'alert', 'Some items could not be shown as written:');
    const ul = el('ul'); problems.forEach(x => ul.append(el('li', null, x))); p.append(ul);
    alerts.append(p);
  }

  $('#sources').replaceChildren(...(Array.isArray(data.sources) ? data.sources : []).map(s => {
    const item = el('li'); item.title = [s.tool, s.state, s.note].filter(Boolean).join(' · ');
    item.append(el('i', 'state ' + (STATE[s.state] || '')), icon(s.kind, 13), s.tool || KIND[s.kind] || s.kind);
    if (s.state !== 'ready') item.append(el('span', null, '(' + s.state + ')'));
    return item;
  }));

  render();
})();
</script>
